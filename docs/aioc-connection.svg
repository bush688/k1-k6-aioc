<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 270" role="img"><title>AIOC 连接示意图</title><g font-family="system-ui, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1080" height="270" rx="24" fill="#0a1b2e" stroke="#0a1b2e"/><text x="32" y="48" font-size="27" fill="#e6f1ff" font-weight="700">AIOC 远程电台如何连接</text><rect x="28" y="85" width="214" height="130" rx="16" fill="#172d44" stroke="#345b7b"/><text x="43" y="122" font-size="21" fill="#e6f1ff" font-weight="700">UV-K1 / UV-K6</text><text x="43" y="159" font-size="16" fill="#b4d1ec" font-weight="500">手台屏幕、按键</text><text x="43" y="185" font-size="16" fill="#b4d1ec" font-weight="500">收发音频与硬件 PTT</text><rect x="298" y="85" width="214" height="130" rx="16" fill="#172d44" stroke="#345b7b"/><text x="313" y="122" font-size="21" fill="#e6f1ff" font-weight="700">AIOC</text><text x="313" y="159" font-size="16" fill="#b4d1ec" font-weight="500">K 头接手台</text><text x="313" y="185" font-size="16" fill="#b4d1ec" font-weight="500">USB 声卡 + 串口</text><rect x="568" y="85" width="214" height="130" rx="16" fill="#172d44" stroke="#345b7b"/><text x="583" y="122" font-size="21" fill="#e6f1ff" font-weight="700">Windows 服务端</text><text x="583" y="159" font-size="16" fill="#b4d1ec" font-weight="500">选择 COM 与音频设备</text><text x="583" y="185" font-size="16" fill="#b4d1ec" font-weight="500">回传画面、控制 PTT</text><rect x="838" y="85" width="214" height="130" rx="16" fill="#172d44" stroke="#345b7b"/><text x="853" y="122" font-size="21" fill="#e6f1ff" font-weight="700">电脑 / 手机</text><text x="853" y="159" font-size="16" fill="#b4d1ec" font-weight="500">局域网控制页</text><text x="853" y="185" font-size="16" fill="#b4d1ec" font-weight="500">收听、画面与键盘</text><path d="M254 150 h30 m-9 -8 l9 8 -9 8" fill="none" stroke="#67e8c0" stroke-width="3"/><path d="M524 150 h30 m-9 -8 l9 8 -9 8" fill="none" stroke="#67e8c0" stroke-width="3"/><path d="M794 150 h30 m-9 -8 l9 8 -9 8" fill="none" stroke="#67e8c0" stroke-width="3"/><text x="32" y="24